<style>
/* Layout: an editor's cutting list. Each shot is a row: clip on the left, a large note pad on the right. */
:root {

}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121415; --panel: #1b1e1f; --ink: #e8eaea; --muted: #9aa1a3; --line: #2e3335;
  --red: #ef6a5f; --red-soft: #3a1f1d; --ok: #7cc18e; --ok-soft: #1d2e22; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121415; --panel: #1b1e1f; --ink: #e8eaea; --muted: #9aa1a3; --line: #2e3335;
  --red: #ef6a5f; --red-soft: #3a1f1d; --ok: #7cc18e; --ok-soft: #1d2e22; color-scheme: dark }
body { background: var(--bg); color: var(--ink); font-family: var(--f-head); }
.wrap { max-width: 1320px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px 80px; }
header.top { display: grid; gap: 10px; padding-bottom: 18px; border-bottom: 2px solid var(--ink); }
h1 { font-size: clamp(26px, 4vw, 40px); margin: 0; letter-spacing: .01em; text-wrap: balance; }
h1 em { font-style: normal; color: var(--red); }
.meta { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; color: var(--muted); font-size: 15px; }
.meta a { color: var(--red); font-weight: 700; }
.tools { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; padding-block: 12px; border-bottom: 1px solid var(--line); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.count { font-family: var(--f-mono); font-size: 13px; color: var(--muted); }
.count b { color: var(--red); font-weight: 500; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { font: 600 14px var(--f-head); padding: 6px 12px; background: var(--panel); color: var(--ink); border: 0; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
label.chk { display: inline-flex; gap: 6px; align-items: center; font-size: 14px; cursor: pointer; }
.status { margin-left: auto; font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.status.bad { color: var(--red); }
h2.sec { font-size: 20px; margin: 34px 0 6px; display: flex; gap: 10px; align-items: baseline; }
h2.sec span { font-family: var(--f-mono); font-size: 13px; color: var(--red); font-weight: 500; }
.shot { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 20px; padding: 18px 0;
  border-bottom: 1px solid var(--line); scroll-margin-top: 70px; }
.shot.playing .clip video { outline: 3px solid var(--red); outline-offset: 2px; }

.clip video { width: 100%; max-width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 4px; display: block; }

textarea { width: 100%; box-sizing: border-box; min-height: 190px; resize: vertical; padding: 12px 14px;

  border-radius: 6px; padding: 8px 12px; margin: 0; }

.mic { font: 600 13px var(--f-head); padding: 5px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }

.partial { font-family: var(--f-mono); font-size: 12px; color: var(--muted); margin: 0; }

.hist summary { cursor: pointer; padding: 4px 0; list-style: none; }
.hist summary::-webkit-details-marker { display: none; }
.hist summary::before { content: "▸ "; }
.hist[open] summary::before { content: "▾ "; }

.hist .q { font-family: var(--f-text); font-size: 15px; line-height: 1.45; margin: 0; color: var(--ink); }
.hist .q b, .hist .reply b { font-family: var(--f-head); font-weight: 700; }
.hist .reply { margin: 0; }
button:focus-visible, a:focus-visible, video:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
@media (max-width: 760px) { .shot { grid-template-columns: minmax(0, 1fr); } textarea { min-height: 140px; } .status { margin-left: 0; width: 100%; } }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

<script>
const DATA = {"title": "The Machine That Doesn't Make Cold, 5-minute sample v1", "drive": "https://drive.google.com/file/d/1d8qVx7lLSnN8xC5m8jWYSH_p1B-QOITp/view?usp=drivesdk", "total": 310.4, "shots": [{"id": "1a-1", "n": 1, "sec": "1a", "secTitle": "", "start": 0.0, "dur": 8.46, "kind": "Kitchen-table theme, warm cream. DATE: TODAY. REASON: -1. A tall paper fridge cutout stands centre, door shut. A paper hand reaches round to", "line": "Reach behind your fridge, down near the bottom, and you will feel something odd. It's warm.", "clip": "v1/clips/1a-1.mp4", "poster": "v1/posters/1a-1.jpg"}, {"id": "1a-2", "n": 2, "sec": "1a", "secTitle": "", "start": 8.46, "dur": 12.08, "kind": "The fridge becomes a cutaway: frosty blue inside, a milk bottle on a shelf, a small thermometer reading cold (blue). Red heat arrows run fro", "line": "The box that keeps your milk cold is pushing heat into your kitchen, day and night. A fridge doesn't make cold. It moves heat.", "clip": "v1/clips/1a-2.mp4", "poster": "v1/posters/1a-2.jpg"}, {"id": "1a-3", "n": 3, "sec": "1a", "secTitle": "", "start": 20.54, "dur": 13.91, "kind": "The fridge LIFTS off. Navy night. DATE: BEFORE 1755. At \"carried down from a mountain\", a snowy peak and a basket of snow sliding down its s", "line": "For almost all of history, that was impossible. Cold could only be gathered: carried down from a mountain, or caught on a winter night. It could not be made from nothing.", "clip": "v1/clips/1a-3.mp4", "poster": "v1/posters/1a-3.jpg"}, {"id": "1b-1", "n": 4, "sec": "1b", "secTitle": "", "start": 34.45, "dur": 7.45, "kind": "Cream. DATE: TODAY. REASON: -1. Serif headline card, one italic red word: \"How do you *make* cold?\". At \"a hole in the sky\", a small paper E", "line": "So how did people learn to make cold? And why did the answer help tear a hole in the sky?", "clip": "v1/clips/1b-1.mp4", "poster": "v1/posters/1b-1.jpg"}, {"id": "1b-2", "n": 5, "sec": "1b", "secTitle": "", "start": 41.9, "dur": 14.01, "kind": "The headline LIFTS off. Five large icons appear along a dotted line, one on each name, while the matching icon in the top-right bar lights w", "line": "The story has five chapters. The ice. The trick. The loop. The poison. And the sky.", "clip": "v1/clips/1b-2.mp4", "poster": "v1/posters/1b-2.jpg"}, {"id": "2a-1", "n": 6, "sec": "2a", "secTitle": "", "start": 55.91, "dur": 14.51, "kind": "Navy night. DATE: IRAN, 1600s. REASON: 0. A flat paper map of Iran slides in; the central desert shaded sand; pin YAZD pops in. At \"forty de", "line": "Iran's central desert, in the sixteen hundreds. Summer afternoons here reach about forty degrees, hotter than a high fever. Yet in towns like Yazd, you could buy ice in high summer.", "clip": "v1/clips/2a-1.mp4", "poster": "v1/posters/2a-1.jpg"}, {"id": "2a-2", "n": 7, "sec": "2a", "secTitle": "", "start": 70.42, "dur": 13.38, "kind": "The map LIFTS off. Side view under a starry navy sky: a long shallow pool on the ground, a tall wall along its south side. A low winter sun ", "line": "It was caught on winter nights. Water from an underground channel ran into a long pool, about as deep as your hand is wide. A tall wall kept the low winter sun off it.", "clip": "v1/clips/2a-2.mp4", "poster": "v1/posters/2a-2.jpg"}, {"id": "2a-3", "n": 8, "sec": "2a", "secTitle": "", "start": 83.8, "dur": 16.92, "kind": "Soft heat arrows rise from the water straight up, past the stars, to a label SPACE at the top of the frame. A small air thermometer beside t", "line": "The cold came from the sky. On a clear, still night, water sends its heat straight up into space, so it can freeze while the air stays above zero. Night after night, layer on layer, the ice grew half a metre thick.", "clip": "v1/clips/2a-3.mp4", "poster": "v1/posters/2a-3.jpg"}, {"id": "2a-4", "n": 9, "sec": "2a", "secTitle": "", "start": 100.72, "dur": 16.4, "kind": "The ice is cut into blocks that slide into a cross-section of a yakhchāl: a deep pit under a tall stepped mud-brick dome, a small paper figu", "line": "Workers cut it into blocks and stacked it in a yakhchāl, an \"ice pit\": a deep hole under a mud-brick dome. The biggest stand as tall as a six-storey building. There the ice lasted into summer, and was sold.", "clip": "v1/clips/2a-4.mp4", "poster": "v1/posters/2a-4.jpg"}, {"id": "2b-1", "n": 10, "sec": "2b", "secTitle": "", "start": 117.12, "dur": 21.3, "kind": "Cream. DATE: ANY TIME. REASON: 0. The dome from 2a, small, dimmed at left. A paper hill fills the frame: HOT (red) at the top, COLD (blue) a", "line": "But the yakhchāl only caught the cold a clear night gave away. It could not make ice in summer. Heat behaves like water on a hill. On its own, it only runs downhill, from hot to cold. A cup of tea cools in a cold room. It never warms itself from the air.", "clip": "v1/clips/2b-1.mp4", "poster": "v1/posters/2b-1.jpg"}, {"id": "2b-2", "n": 11, "sec": "2b", "secTitle": "", "start": 138.42, "dur": 8.58, "kind": "The mug LIFTS off. A paper hand pushes the HEAT ball back UP the hill; a label WORK appears on the hand. At \"Remember that.\", the ball holds", "line": "To make cold on demand, you would have to push heat uphill. Remember that.", "clip": "v1/clips/2b-2.mp4", "poster": "v1/posters/2b-2.jpg"}, {"id": "3a-1", "n": 12, "sec": "3a", "secTitle": "", "start": 147.0, "dur": 13.32, "kind": "Cream. DATE: GLASGOW, 1755. REASON: 1. Portrait: William Cullen, plate WILLIAM CULLEN · PROFESSOR OF MEDICINE, credit WELLCOME COLLECTION · ", "line": "Glasgow, seventeen fifty-five. A pupil of the professor William Cullen noticed something odd. A thermometer dipped in spirit got colder as it dried.", "clip": "v1/clips/3a-1.mp4", "poster": "v1/posters/3a-1.jpg"}, {"id": "3a-2", "n": 13, "sec": "3a", "secTitle": "", "start": 160.32, "dur": 17.7, "kind": "The portrait LIFTS off. A paper swimmer steps out of a pool into the wind; small droplets lift off the skin as pale puffs, each carrying a l", "line": "You have felt it, stepping out of a pool on a windy day. To turn into vapour, a liquid needs energy, and it takes it as heat from whatever it touches. Evaporating a gram of water takes five times the heat of bringing it from freezing to boiling.", "clip": "v1/clips/3a-2.mp4", "poster": "v1/posters/3a-2.jpg"}, {"id": "3a-3", "n": 14, "sec": "3a", "secTitle": "", "start": 178.02, "dur": 8.62, "kind": "The swimmer LIFTS off. A paper air pump beside a glass jar on a plate. Inside the jar, a small vessel labelled ETHER sits in a dish of water", "line": "So Cullen set a vessel of ether, a liquid that boils easily, in water inside a glass jar, and pumped the air out.", "clip": "v1/clips/3a-3.mp4", "poster": "v1/posters/3a-3.jpg"}, {"id": "3a-4", "n": 15, "sec": "3a", "secTitle": "", "start": 186.64, "dur": 15.7, "kind": "Side panel: a paper Everest with a kettle on its summit, a thermometer at 70 °C, a limp cup of tea. At \"In Cullen's jar\", the panel LIFTS of", "line": "Less air pressing down means a liquid boils colder. On top of Everest, water boils at about seventy degrees, too cool for a good cup of tea. In Cullen's jar, the ether boiled at room temperature, and pulled heat out of the water around it.", "clip": "v1/clips/3a-4.mp4", "poster": "v1/posters/3a-4.jpg"}, {"id": "3a-5", "n": 16, "sec": "3a", "secTitle": "", "start": 202.34, "dur": 10.09, "kind": "Ice crystals spread through the dish and a white crust grows round the ether vessel. A paper quote card slides in: \"we found the most part o", "line": "He wrote: \"we found the most part of the water frozen, and the vessel containing the aether surrounded with a thick and firm crust of ice.\"", "clip": "v1/clips/3a-5.mp4", "poster": "v1/posters/3a-5.jpg"}, {"id": "3b-1", "n": 17, "sec": "3b", "secTitle": "", "start": 212.43, "dur": 8.27, "kind": "The quote card LIFTS off. The jar again: the ether level drops; its vapour puffs leave through the pump and drift off screen; a small label ", "line": "But every drop of ether that boiled was sucked out through the pump and lost. To keep the cold coming, you had to keep pouring in more.", "clip": "v1/clips/3b-1.mp4", "poster": "v1/posters/3b-1.jpg"}, {"id": "3b-2", "n": 18, "sec": "3b", "secTitle": "", "start": 220.7, "dur": 9.36, "kind": "The jar slides onto a paper shelf. At \"eighteen-oh-five\", a ruler runs 1755 → 1805 with a faint pencil sketch of a machine at 1805 (label: D", "line": "Cullen never built a machine. In eighteen-oh-five, an American described one in a book. He never built it.", "clip": "v1/clips/3b-2.mp4", "poster": "v1/posters/3b-2.jpg"}, {"id": "4a-1", "n": 19, "sec": "4a", "secTitle": "", "start": 230.06, "dur": 11.92, "kind": "Cream. DATE: ENGLAND, 1834. REASON: 2. Portrait: Jacob Perkins, plate JACOB PERKINS · AMERICAN INVENTOR. A small patent scroll beside it: \"P", "line": "England, eighteen thirty-four. Jacob Perkins, an American inventor, patented a way to stop losing the liquid. Catch the vapour, squeeze it back into a liquid, and send it round again.", "clip": "v1/clips/4a-1.mp4", "poster": "v1/posters/4a-1.jpg"}, {"id": "4a-2", "n": 20, "sec": "4a", "secTitle": "", "start": 241.98, "dur": 4.18, "kind": "Portrait and scroll LIFT off. A large paper diagram: a cabinet outline (left) and a closed loop of pipe running inside it and out of its bac", "line": "Your fridge runs on that same loop. It has four parts.", "clip": "v1/clips/4a-2.mp4", "poster": "v1/posters/4a-2.jpg"}, {"id": "4a-3", "n": 21, "sec": "4a", "secTitle": "", "start": 246.16, "dur": 6.74, "kind": "The EVAPORATOR coil inside the cabinet lights, label EVAPORATOR. Blue drops boil into pale puffs; red heat arrows flow from a milk bottle in", "line": "Inside the box, the liquid boils at low pressure and soaks up heat from your food. That is the evaporator.", "clip": "v1/clips/4a-3.mp4", "poster": "v1/posters/4a-3.jpg"}, {"id": "4a-4", "n": 22, "sec": "4a", "secTitle": "", "start": 252.9, "dur": 7.86, "kind": "The COMPRESSOR (a paper piston in a cylinder, under the cabinet) appears, label COMPRESSOR. The piston pushes; the pale puffs crowd together", "line": "From there, a pump called the compressor squeezes the vapour. Squeezing a gas heats it up, the way a bicycle pump grows warm in your hand.", "clip": "v1/clips/4a-4.mp4", "poster": "v1/posters/4a-4.jpg"}, {"id": "4a-5", "n": 23, "sec": "4a", "secTitle": "", "start": 260.76, "dur": 9.42, "kind": "The CONDENSER coil on the back of the cabinet appears, label CONDENSER. Red heat arrows flow out of it into the kitchen side of the frame; r", "line": "Now hotter than your kitchen, it runs through coils outside, the condenser. Its heat flows downhill into the room, and it turns back to liquid.", "clip": "v1/clips/4a-5.mp4", "poster": "v1/posters/4a-5.jpg"}, {"id": "4a-6", "n": 24, "sec": "4a", "secTitle": "", "start": 270.18, "dur": 6.28, "kind": "A narrow tube between condenser and evaporator, label EXPANSION. Drops squeeze through it one by one and turn blue; a small pressure gauge n", "line": "Last, it squeezes through a narrow tube. The pressure drops, and it goes cold again.", "clip": "v1/clips/4a-6.mp4", "poster": "v1/posters/4a-6.jpg"}, {"id": "4a-7", "n": 25, "sec": "4a", "secTitle": "", "start": 276.46, "dur": 2.86, "kind": "The paper hill from 2b slides in small at the top-right of the diagram; the compressor's piston pushes the HEAT ball up it, label WORK. The ", "line": "That is the push uphill.", "clip": "v1/clips/4a-7.mp4", "poster": "v1/posters/4a-7.jpg"}, {"id": "4b-1", "n": 26, "sec": "4b", "secTitle": "", "start": 279.32, "dur": 7.24, "kind": "Kitchen-table theme. DATE: TODAY. REASON: 2. The paper fridge from 1a slides back in; the loop from 4a is drawn faintly inside it. The back ", "line": "Now, back to your kitchen. That warmth behind your fridge is the heat taken out of your milk, plus the work of the pump.", "clip": "v1/clips/4b-1.mp4", "poster": "v1/posters/4b-1.jpg"}, {"id": "4b-2", "n": 27, "sec": "4b", "secTitle": "", "start": 286.56, "dur": 7.78, "kind": "The fridge LIFTS off. Cream. DATE: 1835. A paper model machine (pipes, a hand crank, a small box) labelled HAGUE'S MODEL · 1835. At \"nobody ", "line": "His patent promised a machine for making ice. An engineer, John Hague, built a working model. Nobody bought one.", "clip": "v1/clips/4b-2.mp4", "poster": "v1/posters/4b-2.jpg"}, {"id": "4b-3", "n": 28, "sec": "4b", "secTitle": "", "start": 294.34, "dur": 16.06, "kind": "The model LIFTS off. At \"eighteen-fifties\", DATE: 1850s and a small paper ice machine gets a SOLD tag. At \"The trouble was\", theme flips to ", "line": "The loop was right. In the eighteen-fifties, it finally sold. The trouble was what came to run inside it: ammonia, sulfur dioxide and methyl chloride. All three were poison.", "clip": "v1/clips/4b-3.mp4", "poster": "v1/posters/4b-3.jpg"}], "collection": "notes-v1", "prev": ""};
const prevBy = {};       // this version's shot id -> earlier notes that point at it
const $ = (s, el = document) => el.querySelector(s);
const tc = t => { const m = Math.floor(t / 60), s = t - m * 60; return m + ":" + s.toFixed(1).padStart(4, "0"); };
const docs = {};          // shot id -> stored doc body
const rowsById = {};
let db = null, canWrite = true, filter = "all", dictating = false;
function pauseAll() { document.querySelectorAll("video").forEach(v => v.pause()); }

document.title = DATA.title + " review";
$("#h1").innerHTML = "";
$("#h1").append(DATA.title + " ", Object.assign(document.createElement("em"), { textContent: "clip review" }));
const meta = $("#meta");
meta.append(`${DATA.shots.length} shots · ${tc(DATA.total)} · type a note beside any clip; it saves by itself`);
if (DATA.drive) { const a = document.createElement("a"); a.href = DATA.drive; a.target = "_blank"; a.rel = "noopener"; a.textContent = "Full-quality cut on Google Drive"; meta.append(a); }

function status(msg, bad) { const s = $("#status"); s.textContent = msg; s.classList.toggle("bad", !!bad); }

let lastSec = null;
const list = $("#list");
DATA.shots.forEach((s, i) => {
  if (s.sec !== lastSec) {
    lastSec = s.sec;
    const h = document.createElement("h2"); h.className = "sec";
    h.append(Object.assign(document.createElement("span"), { textContent: "Section " + s.sec }), s.secTitle);
    list.append(h);
  }
  const row = document.createElement("article"); row.className = "shot"; row.id = s.id;
  row.innerHTML = `
    <div class="clip">
      <video controls preload="none" playsinline poster="${s.poster}" src="${s.clip}"></video>
      <div class="tag"><span class="id"></span><span class="tc"></span><span class="kind"></span></div>
      <p class="line"></p>
    </div>
    <div class="note">
      <textarea id="note-${s.id}" placeholder="What should change in this shot? Script, image, marks, motion, sound, timing…"></textarea>
      <div class="foot"><span class="saved"></span><span class="state"></span><button type="button" class="mic" hidden>Dictate</button></div>
      <p class="partial" hidden></p>
      <p class="reply" hidden></p>
      <details class="hist" hidden><summary></summary><div class="hlist"></div></details>
    </div>`;
  $(".id", row).textContent = "Shot " + s.n + " · " + s.id;
  $(".tc", row).textContent = tc(s.start) + " – " + tc(s.start + s.dur);
  $(".kind", row).textContent = s.kind;
  $(".line", row).textContent = s.line;
  const ta = $("textarea", row);
  let timer = null;
  ta.addEventListener("focus", pauseAll);
  ta.addEventListener("input", () => { $(".saved", row).textContent = "typing…"; clearTimeout(timer); timer = setTimeout(() => save(s, row), 1200); });
  ta.addEventListener("blur", () => { if (timer) { clearTimeout(timer); timer = null; save(s, row); } });
  const v = $("video", row);
  v.addEventListener("play", () => { document.querySelectorAll("video").forEach(o => { if (o !== v) o.pause(); }); document.querySelectorAll(".shot.playing").forEach(r => r.classList.remove("playing")); row.classList.add("playing"); });
  v.addEventListener("ended", () => {
    row.classList.remove("playing");
    // Reason: never move on while a note is being typed or dictated.
    if (!$("#auto").checked || (document.activeElement && document.activeElement.tagName === "TEXTAREA") || dictating) return;
    let j = i + 1; while (j < DATA.shots.length && rowsById[DATA.shots[j].id].hidden) j++;
    if (j >= DATA.shots.length) return;
    const next = rowsById[DATA.shots[j].id];
    next.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "center" });
    $("video", next).play().catch(() => {});
  });
  rowsById[s.id] = row;
  list.append(row);
});


const pending = {}, inflight = {};
async function save(s, row) {
  if (!db || !canWrite) { $(".saved", row).textContent = db ? "read-only" : "not saved: notes store unavailable"; return; }
  const body = { shot: s.id, n: s.n, tc: tc(s.start), text: $("textarea", row).value };
  const old = docs[s.id];
  if (old && old.text === body.text) { $(".saved", row).textContent = old.updatedAt ? "saved" : ""; return; }
  if (inflight[s.id]) { pending[s.id] = true; return; }
  inflight[s.id] = true;
  body.updatedAt = new Date().toISOString();
  body.status = body.text.trim() ? (old && old.status === "done" && old.text === body.text ? "done" : "open") : "empty";
  $(".saved", row).textContent = "saving…";
  try {
    const ref = db.collection(DATA.collection || "notes").doc(s.id);
    if (old) await ref.update(body); else await ref.set(body);
    docs[s.id] = { ...(old || {}), ...body };
    $(".saved", row).textContent = "saved " + new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    paint(s.id);
  } catch (e) {
    if (e && e.code === "invalid_argument" && !old) { canWrite = false; status("You can read these notes but not write them.", true); }
    $(".saved", row).textContent = "not saved (" + (e && e.code || "error") + ")";
  } finally {
    inflight[s.id] = false;
    if (pending[s.id]) { pending[s.id] = false; save(s, row); }
  }
}

function paint(id) {
  const row = rowsById[id], d = docs[id];
  if (!row) return;
  const ta = $("textarea", row);
  if (d && document.activeElement !== ta && !inflight[id]) {
    ta.value = d.text || "";
  }
  const st = $(".state", row);
  st.textContent = ""; st.className = "state";
  if (d && (d.status === "open" || d.status === "done")) { st.textContent = d.status === "done" ? "done" : "open"; st.className = "state pill " + d.status; }
  const rep = $(".reply", row);
  if (d && d.reply) { rep.hidden = false; rep.innerHTML = ""; rep.append(Object.assign(document.createElement("b"), { textContent: "Claude: " }), d.reply); } else rep.hidden = true;
  applyFilter();
}

function hasNote(id) { const d = docs[id]; return d && (d.text || "").trim(); }
function applyFilter() {
  let noted = 0, open = 0;
  DATA.shots.forEach(s => {
    const n = hasNote(s.id), o = n && docs[s.id].status !== "done";
    if (n) noted++; if (o) open++;
    rowsById[s.id].hidden = filter === "noted" ? !n : filter === "open" ? !o : false;
  });
  document.querySelectorAll("h2.sec").forEach(h => {
    let el = h.nextElementSibling, any = false;
    while (el && el.tagName !== "H2") { if (!el.hidden) any = true; el = el.nextElementSibling; }
    h.hidden = !any;
  });
  $("#count").innerHTML = "";
  $("#count").append("Notes: ", Object.assign(document.createElement("b"), { textContent: open + " open" }), " · " + (noted - open) + " done");
}
["all", "noted", "open"].forEach(f => $("#f-" + f).addEventListener("click", () => {
  filter = f; ["all", "noted", "open"].forEach(g => $("#f-" + g).setAttribute("aria-pressed", g === f ? "true" : "false")); applyFilter();
}));
applyFilter();

// ---- Dictate button on every box: Claude's own speech-to-text, a fallback for outside dictation tools ----
(async () => {
  let dict = null;
  try { dict = window.claude ? await window.claude.use("dictation") : null; } catch { dict = null; }
  if (!dict) return;
  let target = null;   // the row being dictated into
  document.querySelectorAll(".mic").forEach(b => b.hidden = false);
  dict.onPartial(({ text }) => { if (!target) return; const p = $(".partial", target); p.hidden = !text; p.textContent = text; });
  dict.onFinal(({ text }) => {
    if (!text || !target) return;
    const ta = $("textarea", target), sep = ta.value && !/\s$/.test(ta.value) ? " " : "";
    ta.value = ta.value + sep + text.trim();
    ta.dispatchEvent(new Event("input"));
    $(".partial", target).hidden = true;
  });
  dict.onState(({ state, reason }) => {
    dictating = state !== "idle";
    document.querySelectorAll(".mic").forEach(b => { const on = dictating && target && b.closest(".shot") === target; b.textContent = on ? "Stop" : "Dictate"; b.classList.toggle("rec", on); });
    if (state === "idle") {
      if (target) { $(".partial", target).hidden = true; $("textarea", target).dispatchEvent(new Event("blur")); }
      target = null;
      if (reason === "not_granted" || reason === "unavailable") document.querySelectorAll(".mic").forEach(b => b.hidden = true);
    }
  });
  document.querySelectorAll(".mic").forEach(b => b.addEventListener("click", () => {
    if (dictating) { dict.stop().catch(() => {}); return; }
    pauseAll(); target = b.closest(".shot");
    dict.start().catch(() => {});
  }));
})();

(async () => {
  try { db = window.claude ? await window.claude.use("db") : null; } catch { db = null; }
  if (!db) { status("Notes store unavailable here: open this page on claude.ai, signed in, to save notes.", true); return; }
  const loading = setTimeout(() => status("Notes store not answering yet; notes typed now may not save.", true), 10000);
  db.collection(DATA.collection || "notes").onSnapshot(snap => {
    if (!snap.metadata.fromCache) { clearTimeout(loading); status("Notes save automatically"); }
    snap.docChanges().forEach(ch => {
      if (ch.type === "removed") delete docs[ch.doc.id]; else docs[ch.doc.id] = ch.doc.data();
      paint(ch.doc.id);
    });
  }, e => { clearTimeout(loading); status("Notes store stopped (" + e.code + "). Reload the page.", true); });
  // Earlier round's notes sit under the shot they now belong to, folded: a note's `next` lists this version's shot ids.
  if (DATA.prev) db.collection(DATA.prev).onSnapshot(snap => {
    Object.keys(prevBy).forEach(k => delete prevBy[k]);
    snap.docs.map(d => d.data()).filter(d => (d.text || "").trim()).forEach(d => {
      (Array.isArray(d.next) && d.next.length ? d.next : [d.shot]).forEach(id => { if (rowsById[id]) (prevBy[id] = prevBy[id] || []).push(d); });
    });
    DATA.shots.forEach(s => {
      const box = $(".hist", rowsById[s.id]), ps = prevBy[s.id] || [];
      box.hidden = ps.length === 0;
      if (!ps.length) return;
      const done = ps.filter(d => d.status === "done").length;
      $("summary", box).textContent = "Last round: " + ps.length + (ps.length === 1 ? " note" : " notes") + " · " + (done === ps.length ? "all changed" : (ps.length - done) + " still open");
      const hl = $(".hlist", box); hl.innerHTML = "";
      ps.sort((x, y) => (x.n || 0) - (y.n || 0)).forEach(d => {
        const w = document.createElement("div"); w.className = "h";
        const q = document.createElement("p"); q.className = "q";
        q.append(Object.assign(document.createElement("b"), { textContent: "You said (old shot " + d.n + "): " }), d.text);
        const r = document.createElement("p"); r.className = "reply";
        r.append(Object.assign(document.createElement("b"), { textContent: "What changed: " }), d.reply || "Not changed yet.");
        w.append(q, r); hl.append(w);
      });
    });
  }, () => {});
  try {
    const user = window.claude ? await window.claude.use("user") : null;
    const w = user && user.can ? await user.can("data.write") : null;
    if (w === false) { canWrite = false; document.querySelectorAll("textarea").forEach(t => t.disabled = true); status("You can read these notes but not write them."); }
  } catch {}
})();
</script>
