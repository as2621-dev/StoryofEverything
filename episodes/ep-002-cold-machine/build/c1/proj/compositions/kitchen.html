      const root = document.querySelector('[data-composition-id="kitchen"]');
      const tl = gsap.timeline({ paused: true });
      const st = Kit.stage(root, { theme: "cream", date: "Today", reasons: C1.REASONS, active: -1, channel: "STORY OF EVERYTHING" });

        { circle: [780, 800, 3], fill: "#F4F8FA", solid: true, flat: true }
      ]);
      // milk bottle on the top shelf, thermometer on the lower shelf (placed on their words)
      const milk = obj(all.g, { x: 850, y: 576, hidden: true });
      draw(st, milk.g, [

      const thObj = obj(all.g, { x: 985, y: 630, hidden: true });
      const th = C1.thermo(st, thObj.g, { h: 110, v: 0.62, c: 1 });

      // side panel (the fridge as you see it), coils and compressor on the back
      const panel = obj(all.g, { pivot: [890, 540] });
      draw(st, panel.g, [

      draw(st, all.g, [

      let coil = "M1088,272";
      for (let y = 272, k = 0; y < 790; y += 26, k++) coil += (k % 2 ? " H1088 A13,13 0 0 0 1088," : " H1116 A13,13 0 0 1 1116,") + (y + 26);
      draw(st, all.g, [
        { d: "M1082,262 L1102,262 M1082,808 L1102,808", stroke: "#3D3B37", sw: 5 },
        { d: coil, stroke: "#3D3B37", sw: 5 },
        { d: "M1100,262 V808", stroke: "#57544D", sw: 3, flat: true },

      ]);

      // ---- the paper hand reaching round the back, low down
      const hand = obj(all.g, { x: 1132, y: 846, hidden: true });
      draw(st, hand.g, [
        { d: rr(150, -38, 920, 76, 34), fill: "#376B67" },
        { d: rr(132, -42, 42, 84, 12), fill: "#2C5753" },
        { d: rr(60, -32, 104, 64, 28), fill: "#E6C39A" },
        { d: rr(72, -56, 56, 18, 9), fill: "#E6C39A", transform: "rotate(-24 100 -47)" },
        { d: rr(4, -30, 82, 15, 7.5), fill: "#E6C39A" },

        { d: rr(2, 2, 86, 15, 7.5), fill: "#E6C39A" },

      tw(tl, hand, 0.35, { dx: 760, r: 5 }, { dx: 0, r: 0 }, 2.3, "power3.out");
      tw(tl, hand, 0.35, { o: 0 }, { o: 1 }, 0.15, "none");

      // ---- 8.46 the fridge becomes a cutaway: the side panel lifts off
      lift(tl, panel, 8.46, { rot: -2.5 });
      place(tl, milk, 9.75, { from: "top", dist: 34, rot: -3 });          // "milk"
      place(tl, thObj, 10.05, { from: "top", dist: 30, rot: 3 });          // "cold"
      th.to(tl, 10.3, 0.16, 0, 0.9);                                       // reads cold (blue)

      // heat arrows: milk -> cabinet -> back coils -> kitchen
      const hIn = C1.heatArrow(st, all.g, [[880, 470], [960, 452], [1040, 448], [1098, 436]], { sw: 7, amp: 8, wl: 70 });
      const hOut1 = C1.heatArrow(st, all.g, [[1134, 420], [1260, 372], [1400, 336], [1530, 318]], { sw: 8, amp: 10, wl: 80 });

      hIn.draw(tl, 11.55, 1.0);       // "heat"
      hOut1.draw(tl, 12.75, 1.0);     // "kitchen"
      hOut2.draw(tl, 13.3, 1.0);      // "day"
      hIn.flow(tl, 12.6, 7.9); hOut1.flow(tl, 13.8, 6.7); hOut2.flow(tl, 14.35, 6.15);   // day and night

      // "It moves heat.": the label HEAT lands on the arrow
      const lab = Kit.label(all.g, [1350, 300], "HEAT", { size: 40, color: "red", anchor: "middle", haloColor: "bg", weight: 600, tracking: "0.22em" });
      lab.in(tl, 18.75, "pop");

      // ---- 20.54 the fridge lifts off; the date moves to the past
      lift(tl, all, 20.45, { rot: 2.5, dur: 0.5 });
      Kit.setDate(tl, 20.45, "Before 1755");

      tl.to({}, { duration: 0.01 }, LEN - 0.01);
      window.__timelines["kitchen"] = tl;
    })();
  </script>
