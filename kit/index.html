<!doctype html>
<html lang="en" data-composition-variables='[{"id":"channel","type":"string","label":"Channel wordmark","default":"OLD ROUTES"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #192733; }
      #root { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <!-- v2 demo (demo_v2.mp4): the kit-sheet. The v1 demo (demo.mp4) mounted demo-route 0–9.5, demo-banda 9–17.5 and
         demo-parade 17–25 (z-index 1–3) with data-duration="25" on the root; see KIT_API.md §1. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="20" data-width="1920" data-height="1080">
      <div id="kit-sheet" data-composition-id="kit-sheet" data-composition-src="compositions/kit-sheet.html"
        data-start="0" data-duration="20" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 1"></div>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
