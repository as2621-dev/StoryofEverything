<template>
  <!-- v1 reference sheet of every cutout and vehicle. Not part of the demo: mount it in index.html to preview. -->
  <link rel="stylesheet" href="assets/kit/kit.css" />
  <style>
    #root { position: absolute; inset: 0; font-family: "Newsreader", serif; }
    #root .kit-mono { font-family: "IBM Plex Mono", monospace; }
  </style>
  <div id="root" data-composition-id="kit-sheet-v1" data-width="1920" data-height="1080"></div>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="assets/vendor/d3-array.min.js"></script>
  <script src="assets/vendor/d3-geo.min.js"></script>
  <script src="assets/vendor/d3-geo-projection.min.js"></script>
  <script src="assets/vendor/topojson-client.min.js"></script>
  <script src="assets/vendor/land-50m.js"></script>
  <script src="assets/vendor/land-110m.js"></script>
  <script src="assets/kit/kit.js"></script>
  <script>
    (function () {
      const root = document.querySelector('[data-composition-id="kit-sheet-v1"]');
      const tl = gsap.timeline({ paused: true });
      const st = Kit.stage(root, { theme: "cream", active: 1 });
      const names = Kit.cutoutNames.filter((n) => n !== "crowdRow");
      names.forEach((n, i) => {
        const x = 170 + (i % 7) * 262, y = 250 + Math.floor(i / 7) * 255;
        Kit.cutout(st, n, { x, y, size: 150, label: n, labelDy: 100, labelOpts: { size: 15, upper: false } });
        if (n === "silhouettePerson") Kit.cutout(st, n, { x: x + 70, y: y + 20, size: 110, pose: "kneel" });
      });
      Kit.vehicleTypes.forEach((t, i) => Kit.vehicle(st, t, { x: 170 + i * 262, y: 1010, scale: 0.55, label: t, labelDy: 40, labelOpts: { size: 15, upper: false } }));
      Kit.cutout(st, "crowdRow", { x: 1610, y: 1000, size: 90, n: 6, highlight: [2] });
      tl.to({}, { duration: 1 }, 0);
      window.__timelines["kit-sheet-v1"] = tl;
    })();
  </script>
</template>
